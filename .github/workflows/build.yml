name: Build Windows EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller customtkinter pynput
      - name: Download model
        run: python src/setup_modelo.py
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "NyxalSearch" --collect-data customtkinter --collect-all sentence_transformers --collect-all onnxruntime src/main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyxalSearch-Windows
          path: dist/NyxalSearch.exe
